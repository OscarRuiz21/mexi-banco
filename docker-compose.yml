# Con un solo comando: docker compose up --build -d
# Mexi Banco v06, PUNTO DE PARTIDA DEL LAB (rama lab/v06-base). Tal como esta, levanta lo mismo que
# v06a: cinco servicios con sus puertos 8081 a 8085, URLs escritas a mano y sin directorio.
# Los modulos discovery (Eureka) y gateway ya existen y compilan; faltan las piezas marcadas
# TODO H1, TODO H2 y TODO H3 (lista completa: grep -rn "TODO H" .). Al terminar los tres hitos:
#   - discovery (Eureka, 8761) con los cinco servicios registrados por nombre
#   - gateway (8080) como unica puerta, con rutas lb://<servicio>
#   - transferencia llamando a http://cuenta por nombre y cuenta en tres replicas, en round robin
# y ./demo-v06.sh corre completo.
#
# Nombre de proyecto propio para no pisar los contenedores, la red ni el volumen de v06a o v05.1.
name: mexi-banco-v06

# Donde esta el directorio y que tan seguido se habla con el. Los valores de Spring Cloud son
# latido 30 s, expiracion 90 s, consulta 30 s y cache del balanceador 35 s: una replica apagada
# tarda minutos en salir del registro. Para que en clase se vea en segundos los bajamos aqui.
# Mientras no exista discovery (H1) estas variables no hacen nada.
x-directorio: &directorio
  EUREKA_URL: http://discovery:8761/eureka/
  EUREKA_LATIDO_S: ${EUREKA_LATIDO_S:-5}
  EUREKA_EXPIRA_S: ${EUREKA_EXPIRA_S:-15}
  EUREKA_CONSULTA_S: ${EUREKA_CONSULTA_S:-5}
  BALANCEADOR_CACHE: ${BALANCEADOR_CACHE:-5s}

# Lo que repiten los cinco servicios. Un ancla de YAML (&) y su uso (<<: *) evitan copiar y pegar.
x-servicio: &servicio
  environment: &entorno-base
    <<: *directorio
    DB_HOST: db
    DB_PORT: "5432"
    DB_USER: mexibanco
    DB_PASSWORD: mexibanco
  depends_on:
    db:
      condition: service_healthy
    # TODO H1: descomenta estas dos lineas para que los servicios esperen al directorio antes de
    # arrancar (no es obligatorio, el cliente de Eureka reintenta solo, pero el registro sale al
    # primer intento y el log no se llena de "Connection refused").
    # discovery:
    #   condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 5
    # Varias JVM arrancando a la vez en una laptop tardan; los fallos dentro de esta ventana no cuentan.
    start_period: 120s

services:
  # UN solo Postgres con UNA base por servicio (las crea db/init/01-crear-bases.sql).
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mexibanco
      POSTGRES_PASSWORD: mexibanco
    volumes:
      - datos:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP (-h 127.0.0.1) y no por socket: mientras corre el script de init, Postgres solo
      # escucha en el socket local. Asi `db` no se declara sano antes de que existan las cinco bases.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mexibanco -d spei"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TODO H1: descomenta el servicio discovery (el directorio). Publicado en el 8761 solo para ver el
  # dashboard. Antes completa los TODO H1 de discovery/: sin @EnableEurekaServer el contenedor
  # se cae al arrancar.
  # discovery:
  #   build: ./discovery
  #   ports:
  #     - "8761:8761"
  #   environment:
  #     # Barrer cada 5 s (60 s por omision), refrescar lo que ven los clientes cada 5 s (30 s)
  #     # y sin autopreservacion (por eso el aviso rojo del dashboard; ver README).
  #     EUREKA_BARRIDO_MS: ${EUREKA_BARRIDO_MS:-5000}
  #     EUREKA_CACHE_MS: ${EUREKA_CACHE_MS:-5000}
  #     EUREKA_AUTOPRESERVACION: ${EUREKA_AUTOPRESERVACION:-false}
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #     start_period: 90s

  # TODO H2: descomenta el servicio gateway (la unica puerta). Antes completa las rutas en
  # gateway/src/main/resources/application.yml.
  # gateway:
  #   build: ./gateway
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     <<: *directorio
  #   depends_on:
  #     discovery:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #     start_period: 120s

  # Cuentas y saldos. Llama a movimiento para asentar el saldo inicial.
  cuenta:
    <<: *servicio
    build: ./cuenta
    # TODO H3: cambia estas dos lineas de `ports` por tres replicas:
    #   deploy:
    #     replicas: 3
    # Tres contenedores no pueden publicar el mismo puerto 8081 de tu maquina, y ya no hace falta:
    # desde afuera se llega por el gateway (H2).
    ports:
      - "8081:8080"
    environment:
      <<: *entorno-base
      DB_NAME: cuenta
      MOVIMIENTO_URL: http://movimiento:8080

  # El ledger. No llama a nadie.
  movimiento:
    <<: *servicio
    build: ./movimiento
    ports:
      - "8082:8080"
    environment:
      <<: *entorno-base
      DB_NAME: movimiento

  # Transferencias internas. Orquesta a cuenta, movimiento y notificacion por HTTP.
  transferencia:
    <<: *servicio
    build: ./transferencia
    ports:
      - "8083:8080"
    environment:
      <<: *entorno-base
      DB_NAME: transferencia
      # TODO H3: llamar por NOMBRE, sin puerto: http://cuenta, http://movimiento y
      # http://notificacion. Solo funciona con el RestClient.Builder @LoadBalanced (TODO H3 en
      # transferencia/.../clientes/ClientesHttp.java); sin el, "cuenta" se resuelve por DNS al
      # puerto 80 y la transferencia responde 503.
      CUENTA_URL: http://cuenta:8080
      MOVIMIENTO_URL: http://movimiento:8080
      NOTIFICACION_URL: http://notificacion:8080
      # Solo para la demo de "lo que se rompio al partir" (ver README). 0 = sin pausa.
      PAUSA_ENTRE_CARGO_Y_ABONO_MS: ${PAUSA_ENTRE_CARGO_Y_ABONO_MS:-0}

  # Avisos al cliente. No llama a nadie.
  notificacion:
    <<: *servicio
    build: ./notificacion
    ports:
      - "8084:8080"
    environment:
      <<: *entorno-base
      DB_NAME: notificacion

  # Transferencia a otro banco con Idempotency-Key. Llama a cuenta, movimiento y notificacion.
  spei:
    <<: *servicio
    build: ./spei
    ports:
      - "8085:8080"
    environment:
      <<: *entorno-base
      DB_NAME: spei
      CUENTA_URL: http://cuenta:8080
      MOVIMIENTO_URL: http://movimiento:8080
      NOTIFICACION_URL: http://notificacion:8080

networks:
  default:
    name: mexibanco-v06

volumes:
  datos:
