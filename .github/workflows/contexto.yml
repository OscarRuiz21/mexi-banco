name: contexto
on:
  push:
    branches: [main]
    paths: ["docs/contexto/**"]
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 docs/contexto/generar.py .
      - run: |
          if ! git diff --quiet -- docs/contexto/CONTEXT.md; then
            git config user.name "fabrica-bot"; git config user.email "fabrica@j3lsoluciones.mx"
            git add docs/contexto/CONTEXT.md
            git commit -m "docs(contexto): regenerar CONTEXT.md [skip ci]"
            git pull --rebase origin main
            git push
          fi
  compuerta:
    name: Decisiones aceptadas solo por personas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          personas=$(grep -oE '^- *@?[A-Za-z0-9-]+' docs/agents/personas.md 2>/dev/null | sed 's/^- *@\?//' | tr '\n' ' ')
          [ -n "$personas" ] || { echo "sin docs/agents/personas.md; compuerta desactivada"; exit 0; }
          quien=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].merged_by.login // empty')
          [ -n "$quien" ] || quien="${{ github.actor }}"
          echo "fusionó: $quien · personas: $personas"
          case " $personas " in *" $quien "*) echo "ok: persona"; exit 0 ;; esac
          err=0
          for f in $(git diff --name-only HEAD~1 HEAD -- docs/contexto/entradas/ 2>/dev/null); do
            [ -f "$f" ] || continue
            nuevo=$(grep -m1 -E '^estado:' "$f" | awk '{print $2}'); [ -z "$nuevo" ] && nuevo=aceptada
            viejo=$(git show HEAD~1:"$f" 2>/dev/null | grep -m1 -E '^estado:' | awk '{print $2}'); [ -z "$viejo" ] && viejo=nueva
            afecta=$(grep -m1 -E '^afecta:' "$f")
            if [ "$nuevo" = aceptada ] && [ "$viejo" != aceptada ] && echo "$afecta" | grep -qE 'decisiones|arquitectura'; then
              echo "::error file=$f::pasó a 'aceptada' en un merge de $quien, que no está en docs/agents/personas.md"; err=1
            fi
          done
          exit $err
