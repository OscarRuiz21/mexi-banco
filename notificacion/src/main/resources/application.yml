server:
  port: 8080

spring:
  application:
    name: notificacion
  datasource:
    # Cada servicio apunta a SU base (notificacion). Nadie mas la lee ni la escribe.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notificacion}
    username: ${DB_USER:mexibanco}
    password: ${DB_PASSWORD:mexibanco}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  # v11: la base de documentos. La bitacora de avisos vive en la coleccion "avisos" de la base
  # "notificacion". Postgres (datasource, arriba) se queda para la bandeja vieja que usa spei.
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/notificacion}
  # v09: donde esta el broker (RabbitMQ). En Compose el host es el nombre del servicio, rabbitmq.
  # La cola, el DLX y la DLQ se declaran en codigo (mensajeria.ConfiguracionMensajeria).
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:mexibanco}
    password: ${RABBIT_PASSWORD:mexibanco}
    listener:
      simple:
        # Ack manual: el consumidor dice cuando un mensaje ya quedo guardado (basicAck) y cuando no
        # sirve (basicNack). Con el modo por omision (auto), Spring haria ack al regresar el metodo.
        acknowledge-mode: manual
        # Cuantos mensajes sin ack puede tener este consumidor a la vez (250 por omision). Pocos, para
        # que en el panel se vea la diferencia entre Ready (esperando) y Unacked (entregado sin ack).
        prefetch: 5
  mvc:
    # Los 400 de validacion (campo faltante, cabecera faltante) tambien salen como Problem Details.
    problemdetails:
      enabled: true

# El directorio (v06). Al arrancar, este servicio se registra en Eureka con su nombre
# (spring.application.name) y su IP, y manda un latido cada EUREKA_LATIDO_S segundos. Si Eureka no
# recibe latido en EUREKA_EXPIRA_S segundos, lo saca del registro. Los valores por omision son los
# de Spring Cloud (30 y 90); docker-compose.yml los baja para que en clase se vea en segundos.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Cada cuanto este servicio pide la lista completa al directorio (la usa el balanceador).
    registry-fetch-interval-seconds: ${EUREKA_CONSULTA_S:30}
  instance:
    # Registrarse con la IP del contenedor y no con su hostname (el ID del contenedor).
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: ${EUREKA_LATIDO_S:30}
    lease-expiration-duration-in-seconds: ${EUREKA_EXPIRA_S:90}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

mexibanco:
  mensajeria:
    # v09: si guardar los avisos falla (la base no contesta), cuanto esperar antes de reencolar el mensaje.
    espera-antes-de-reencolar-ms: ${ESPERA_ANTES_DE_REENCOLAR_MS:1000}
  demo:
    # Solo para la demo en clase (v09): milisegundos entre guardar los avisos y hacer ack. En esa
    # ventana se mata notificacion para ver la reentrega. En 0 no hace nada. Ver README.
    pausa-antes-del-ack-ms: ${PAUSA_ANTES_DEL_ACK_MS:0}
