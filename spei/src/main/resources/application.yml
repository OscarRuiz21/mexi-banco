server:
  port: 8080

spring:
  application:
    name: spei
  datasource:
    # Cada servicio apunta a SU base (spei). Nadie mas la lee ni la escribe.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spei}
    username: ${DB_USER:mexibanco}
    password: ${DB_PASSWORD:mexibanco}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mvc:
    # Los 400 de validacion (campo faltante, cabecera faltante) tambien salen como Problem Details.
    problemdetails:
      enabled: true

# A quien llama este servicio. URL base por variable de entorno (factor III); el valor por omision
# sirve para correrlo fuera de Docker con los puertos publicados.
mexibanco:
  servicios:
    cuenta: ${CUENTA_URL:http://localhost:8081}
    movimiento: ${MOVIMIENTO_URL:http://localhost:8082}
    notificacion: ${NOTIFICACION_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
