server:
  port: 8080

spring:
  application:
    name: cuenta
  datasource:
    # Cada servicio apunta a SU base (cuenta). Nadie mas la lee ni la escribe.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cuenta}
    username: ${DB_USER:mexibanco}
    password: ${DB_PASSWORD:mexibanco}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  # v11: donde esta Redis. En Compose el host es el nombre del servicio, redis.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Si Redis no contesta en este tiempo, la operacion de cache falla (no se queda colgada).
      timeout: 500ms
  cache:
    # redis: la cache vive en Redis y la comparten las tres replicas. none: sin cache (cada GET va a
    # Postgres); sirve para medir la latencia sin ella. Solo aplica cuando hay @EnableCaching.
    type: ${CACHE_TIPO:redis}
  mvc:
    # Los 400 de validacion (campo faltante, cabecera faltante) tambien salen como Problem Details.
    problemdetails:
      enabled: true

# A quien llama este servicio. URL base por variable de entorno (factor III); el valor por omision
# sirve para correrlo fuera de Docker con los puertos publicados.
mexibanco:
  servicios:
    movimiento: ${MOVIMIENTO_URL:http://localhost:8082}

  # v11: cuanto vive una entrada de la cache "cuentas" (GET /cuentas/{clabe}). Es el tiempo maximo que
  # el saldo que se MUESTRA puede ir atras de Postgres si nadie lo borra. En Compose: CACHE_TTL.
  cache:
    ttl: ${CACHE_TTL:30s}

# El directorio (v06). Al arrancar, este servicio se registra en Eureka con su nombre
# (spring.application.name) y su IP, y manda un latido cada EUREKA_LATIDO_S segundos. Si Eureka no
# recibe latido en EUREKA_EXPIRA_S segundos, lo saca del registro. Los valores por omision son los
# de Spring Cloud (30 y 90); docker-compose.yml los baja para que en clase se vea en segundos.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Cada cuanto este servicio pide la lista completa al directorio (la usa el balanceador).
    registry-fetch-interval-seconds: ${EUREKA_CONSULTA_S:30}
  instance:
    # Registrarse con la IP del contenedor y no con su hostname (el ID del contenedor).
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: ${EUREKA_LATIDO_S:30}
    lease-expiration-duration-in-seconds: ${EUREKA_EXPIRA_S:90}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # v11: la cache no decide si cuenta esta viva. Si Redis cae, cuenta sigue sana y lee de Postgres.
    redis:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
