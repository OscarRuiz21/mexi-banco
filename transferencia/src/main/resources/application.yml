server:
  port: 8080

spring:
  application:
    name: transferencia
  datasource:
    # Cada servicio apunta a SU base (transferencia). Nadie mas la lee ni la escribe.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transferencia}
    username: ${DB_USER:mexibanco}
    password: ${DB_PASSWORD:mexibanco}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    loadbalancer:
      cache:
        # Cuanto guarda el balanceador la lista de instancias que le dio Eureka (35 s por omision).
        # Es una copia mas que puede ir atras del directorio. Ver README.
        ttl: ${BALANCEADOR_CACHE:35s}
  # v09: donde esta el broker (RabbitMQ). En Compose el host es el nombre del servicio, rabbitmq.
  # El exchange se declara en codigo (ConfiguracionMensajeria); aqui va como se publica.
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:mexibanco}
    password: ${RABBIT_PASSWORD:mexibanco}
    # Si el broker no contesta, rendirse a los 2 s (60 s por omision): la transferencia ya termino y
    # el cliente no debe esperar un minuto por un aviso.
    connection-timeout: 2s
    # Publisher confirms: el broker contesta ack o nack por cada mensaje y PublicadorDeEventos espera
    # esa respuesta. "correlated" la une con el mensaje por su CorrelationData (el eventoId).
    publisher-confirm-type: correlated
    # Que el broker REGRESE el mensaje si ninguna cola lo recibe, en lugar de tirarlo en silencio.
    publisher-returns: true
    template:
      mandatory: true
  mvc:
    # Los 400 de validacion (campo faltante, cabecera faltante) tambien salen como Problem Details.
    problemdetails:
      enabled: true

# A quien llama este servicio: por NOMBRE en el directorio, sin host ni puerto. El RestClient
# balanceado (ClientesHttp) cambia "cuenta" por la IP y el puerto de una instancia registrada.
# Siguen siendo variables de entorno (factor III), pero ya no dicen donde esta nadie.
mexibanco:
  servicios:
    cuenta: ${CUENTA_URL:http://cuenta}
    movimiento: ${MOVIMIENTO_URL:http://movimiento}
    # v09: notificacion ya no esta aqui. Transferencia no la llama: publica eventos en RabbitMQ.
  # Timeout explicito de cada llamada saliente (cuenta y movimiento). Ver ClientesHttp.
  timeouts:
    conexion-ms: ${TIMEOUT_CONEXION_MS:1000}
    lectura-ms: ${TIMEOUT_LECTURA_MS:2000}
  mensajeria:
    # v09: cuanto espera PublicadorDeEventos la confirmacion del broker antes de darlo por no publicado.
    espera-confirmacion-ms: ${ESPERA_CONFIRMACION_MS:5000}
  saga:
    # Cada cuanto el reintento programado busca transferencias en COMPENSACION_PENDIENTE (v08).
    reintento-compensaciones-ms: ${REINTENTO_COMPENSACIONES_MS:10000}
  demo:
    # Solo para la demo en clase: milisegundos de espera entre el cargo y el abono, para apagar
    # cuenta a mano en medio. En 0 no hace nada. Ver README.
    pausa-entre-cargo-y-abono-ms: ${PAUSA_ENTRE_CARGO_Y_ABONO_MS:0}
    # Solo para la demo en clase (v08): el abono hacia esta CLABE falla a proposito y la saga
    # compensa, con cuenta arriba. Vacia = nunca falla. Ver README.
    fallar-abono-a-clabe: ${FALLAR_ABONO_A_CLABE:}

# El circuit breaker de las llamadas a cuenta (v08, Resilience4j). Los umbrales son pequenos a
# proposito, para que en clase se vea abrir, semiabrir y cerrar en segundos:
#   - ventana de las ultimas 4 llamadas; con al menos 4 registradas, si falla el 50% o mas, se ABRE;
#   - abierto 10 s sin llamar a cuenta; luego pasa solo a SEMIABIERTO;
#   - en semiabierto deja pasar 2 llamadas de prueba: si salen bien se CIERRA, si no, se vuelve a abrir.
# Que cuenta como falla lo decide FallaDeCuenta (los 4xx de cuenta no cuentan).
# Se ve en GET /actuator/circuitbreakers y /actuator/circuitbreakerevents (dentro del contenedor).
resilience4j:
  circuitbreaker:
    instances:
      cuenta:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${CIRCUITO_ABIERTO_S:10}s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 2
        record-failure-predicate: mx.mexibanco.clientes.FallaDeCuenta

# El directorio (v06). Al arrancar, este servicio se registra en Eureka con su nombre
# (spring.application.name) y su IP, y manda un latido cada EUREKA_LATIDO_S segundos. Si Eureka no
# recibe latido en EUREKA_EXPIRA_S segundos, lo saca del registro. Los valores por omision son los
# de Spring Cloud (30 y 90); docker-compose.yml los baja para que en clase se vea en segundos.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Cada cuanto este servicio pide la lista completa al directorio (la usa el balanceador).
    registry-fetch-interval-seconds: ${EUREKA_CONSULTA_S:30}
  instance:
    # Registrarse con la IP del contenedor y no con su hostname (el ID del contenedor).
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: ${EUREKA_LATIDO_S:30}
    lease-expiration-duration-in-seconds: ${EUREKA_EXPIRA_S:90}

management:
  endpoints:
    web:
      exposure:
        # v08: circuitbreakers (estado de cada circuito) y circuitbreakerevents (sus ultimos cambios).
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
